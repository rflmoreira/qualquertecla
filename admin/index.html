    <script>
        (function applyLoginBrand() {
            function toBrandTitleCase(name) {
                const raw = String(name || '').trim();
                if (!raw) return '';
                return raw
                    .toLocaleLowerCase('pt-BR')
                    .split(/\s+/)
                    .filter(Boolean)
                    .map(function (word) {
                        return word.charAt(0).toLocaleUpperCase('pt-BR') + word.slice(1);
                    })
                    .join(' ');
            }

            function esc(s) {
                return String(s)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
            }

            function syncWordmark(brand, name) {
                const words = toBrandTitleCase(name || 'Qualquer Tecla').split(/\s+/).filter(Boolean);
                let lead = 'QUALQUER';
                let mark = 'TECLA';
                if (words.length >= 2) {
                    lead = words.slice(0, -1).join(' ').toLocaleUpperCase('pt-BR');
                    mark = words[words.length - 1].toLocaleUpperCase('pt-BR');
                } else if (words.length === 1) {
                    lead = '';
                    mark = words[0].toLocaleUpperCase('pt-BR');
                }
                const wm = brand.querySelector('.qt-footer-wordmark');
                if (!wm) return;
                wm.innerHTML =
                    (lead
                        ? '<span class="brand-word brand-word--lead">' + esc(lead) + '</span>'
                        : '') +
                    '<span class="brand-word brand-word--mark">' +
                    esc(mark) +
                    '</span>';
            }

            var prose = 'Qualquer Tecla';
            try {
                if (window.MockData && typeof window.MockData.getSiteSettings === 'function') {
                    prose = String(window.MockData.getSiteSettings().siteName || prose).trim() || prose;
                }
            } catch (_) {
                /* ignore */
            }

            prose = toBrandTitleCase(prose) || 'Qualquer Tecla';

            var brand = document.getElementById('loginBrand');
            if (brand) {
                syncWordmark(brand, prose);
                brand.setAttribute('aria-label', prose);
                var hidden = brand.querySelector('.visually-hidden');
                if (hidden) hidden.textContent = prose;
            }
            document.title = prose + ' | Acesso Editorial';

            function bindKeycap() {
                if (window.KeycapLogo && typeof window.KeycapLogo.bind === 'function') {
                    window.KeycapLogo.bind(document);
                }
            }
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', bindKeycap);
            } else {
                bindKeycap();
            }
        })();

        function goDashboard() {
            window.location.href =
                window.AdminAuth && window.AdminAuth.adminDashboardUrl
                    ? window.AdminAuth.adminDashboardUrl()
                    : '/admin/dashboard.html';
        }

        if (window.AdminAuth && window.AdminAuth.isLoggedIn()) {
            goDashboard();
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const emailEl = document.getElementById('email');
            const passwordEl = document.getElementById('password');
            const email = emailEl.value.trim();
            const password = passwordEl.value;
            const errorDiv = document.getElementById('loginError');
            const btn = document.getElementById('loginBtn');
            const label = btn.querySelector('.login-submit-label') || btn;
            const prevLabel = label.textContent;
            errorDiv.textContent = '';
            errorDiv.className = 'login-error';
            btn.disabled = true;
            btn.classList.add('is-loading');
            btn.setAttribute('aria-busy', 'true');
            label.textContent = 'Autenticando...';
            try {
                await window.AdminAuth.login(email, password);
                goDashboard();
            } catch (err) {
                errorDiv.className = 'login-error login-error--active admin-alert admin-alert--error';
                errorDiv.textContent = err.message || 'Falha no login.';
                btn.disabled = false;
                btn.classList.remove('is-loading');
                btn.removeAttribute('aria-busy');
                label.textContent = prevLabel || 'Entrar';
                const focusEl = !email ? emailEl : passwordEl;
                focusEl?.focus();
            }
        });
    </script>
