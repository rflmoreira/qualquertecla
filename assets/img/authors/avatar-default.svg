<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-label="Avatar padrao">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="68%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0c0c0c"/>
    </radialGradient>
    <linearGradient id="gold" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#e8c96a"/>
      <stop offset="55%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#a88620"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="rgba(255,255,255,0.05)"/>
    </pattern>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#dots)"/>

  <!-- Anel editorial -->
  <circle cx="200" cy="200" r="148" fill="none" stroke="#d4af37" stroke-opacity="0.22" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="138" fill="none" stroke="#d4af37" stroke-opacity="0.08" stroke-width="8"/>

  <!-- Silhueta refinada (proporcao para crop circular) -->
  <g fill="url(#gold)">
    <ellipse cx="200" cy="156" rx="52" ry="56"/>
    <path d="M112 318
             C118 262 148 228 200 228
             C252 228 282 262 288 318
             C288 332 280 340 200 340
             C120 340 112 332 112 318Z"/>
  </g>
</svg>
